AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Creates an ACM public certificate validated via DNS (Route 53), plus a
  DNS record pointing a domain name at a target (ALB, CloudFront, or any
  hostname). Assumes the hosted zone already exists in Route 53.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project
        Parameters:
          - ProjectName
          - Environment
          - CiSuffix
      - Label:
          default: Certificate
        Parameters:
          - DomainName
          - SubjectAlternativeNames
          - ValidationMethod
      - Label:
          default: DNS record
        Parameters:
          - HostedZoneId
          - RecordType
          - DnsTargetValue
          - DnsTTL

Parameters:
  ProjectName:
    Type: String
    Default: "cfn-nested"
    Description: Project prefix used in the certificate Name tag (e.g. cfn-nstd)

  HostedZoneId:
    Type: String
    Default: "Z04971833SSSXE4CFQ3M"
    Description: ID of the existing Route 53 public hosted zone (e.g. Z0123456789ABCDEF)

  DomainName:
    Type: String
    Description: Fully qualified domain name for the certificate and DNS record (e.g. app.example.com)
    AllowedPattern: "^(\\*\\.)?([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\\.)+[a-zA-Z]{2,}$"
    ConstraintDescription: Must be a valid domain name. A leading *. is allowed for wildcard certificates.

  SubjectAlternativeNames:
    Type: CommaDelimitedList
    Default: ""
    Description: Optional additional domain names to include on the certificate (comma separated). Leave empty for none.

  RecordType:
    Type: String
    Default: CNAME
    AllowedValues:
      - CNAME
      - A
    Description: >
      CNAME points DomainName at DnsTargetValue (a hostname). Use A only when
      DnsTargetValue is an IPv4 address.

  DnsTargetValue:
    Type: String
    Description: Target for the DNS record. A hostname for CNAME, or an IPv4 address for A.

  DnsTTL:
    Type: Number
    Default: 300
    MinValue: 1
    Description: TTL in seconds for the DNS record

  ValidationMethod:
    Type: String
    Default: DNS
    AllowedValues:
      - DNS
    Description: Certificate validation method. Only DNS is supported by this template.

  Environment:
    Type: String
    Description: Environment label used in the certificate Name tag (e.g. devl, stag, prod)

  CiSuffix:
    Type: String
    Default: ""
    Description: Optional suffix for CI/CD unique deployments. Leave empty for none.

Conditions:
  HasSubjectAlternativeNames: !Not [!Equals [!Join ["", !Ref SubjectAlternativeNames], ""]]
  IsCnameRecord: !Equals [!Ref RecordType, CNAME]
  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, ""]]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: !If
        - HasSubjectAlternativeNames
        - !Ref SubjectAlternativeNames
        - !Ref AWS::NoValue
      ValidationMethod: !Ref ValidationMethod
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      CertificateTransparencyLoggingPreference: ENABLED
      Tags:
        - Key: Name
          Value: !If
            - HasCiSuffix
            - !Sub "${ProjectName}-${DomainName}-${Environment}-${CiSuffix}"
            - !Sub "${ProjectName}-${DomainName}-${Environment}"

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: !Ref RecordType
      TTL: !If [IsCnameRecord, !Ref DnsTTL, !Ref AWS::NoValue]
      ResourceRecords:
        - !Ref DnsTargetValue

Outputs:
  CertificateArn:
    Description: ARN of the ACM certificate. Use this in ALB listeners, CloudFront, API Gateway, etc.
    Value: !Ref Certificate
    Export:
      Name: !Sub "${AWS::StackName}-CertificateArn"

  DomainName:
    Description: The domain name secured by the certificate
    Value: !Ref DomainName

  DnsRecordName:
    Description: The DNS record created in the hosted zone
    Value: !Ref DnsRecord
